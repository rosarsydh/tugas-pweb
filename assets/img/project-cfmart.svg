<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Background Navy -->
  <rect width="600" height="360" fill="#1e293b" rx="8"/>

  <!-- Desktop App Window Frame (C# Windows Form style) -->
  <g transform="translate(35, 30)">
    <!-- Header Window -->
    <rect width="530" height="300" fill="#ffffff" rx="6" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M0 6 C0 2.68 2.68 0 6 0 L524 0 C527.32 0 530 2.68 530 6 L530 32 L0 32 Z" fill="#1e3a8a"/>
    <text x="15" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">CFMART - Sistem Kasir &amp; Stok Resto Lele [C# OOP &amp; PSQL]</text>
    <rect x="475" y="8" width="15" height="15" rx="2" fill="#3b82f6"/>
    <rect x="500" y="8" width="15" height="15" rx="2" fill="#ef4444"/>

    <!-- Left: Menu Pesanan / Kasir -->
    <rect x="15" y="45" width="280" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="25" y="68" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold">Daftar Menu Resto Lele</text>
    
    <!-- Menu Rows -->
    <rect x="25" y="80" width="260" height="32" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="35" y="100" fill="#334155" font-family="sans-serif" font-size="11">Pecel Lele Goreng Spesial</text>
    <text x="220" y="100" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold">Rp 15.000</text>

    <rect x="25" y="120" width="260" height="32" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="35" y="140" fill="#334155" font-family="sans-serif" font-size="11">Lele Bakar Madu Pedas</text>
    <text x="220" y="140" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold">Rp 18.000</text>

    <rect x="25" y="160" width="260" height="32" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="35" y="180" fill="#334155" font-family="sans-serif" font-size="11">Paket Lele Crispy + Es Teh</text>
    <text x="220" y="180" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold">Rp 20.000</text>

    <rect x="25" y="210" width="120" height="30" fill="#1e3a8a" rx="4"/>
    <text x="45" y="230" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">+ Tambah Item</text>

    <!-- Right: Struk / Ringkasan Database Postgres -->
    <rect x="310" y="45" width="205" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
    <text x="320" y="68" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold">Ringkasan Transaksi</text>
    
    <text x="320" y="95" fill="#64748b" font-family="sans-serif" font-size="11">No. Faktur: CFM-2024-001</text>
    <text x="320" y="115" fill="#64748b" font-family="sans-serif" font-size="11">Status DB: Terkoneksi (PSQL)</text>
    <line x1="320" y1="125" x2="505" y2="125" stroke="#cbd5e1" stroke-dasharray="3,3"/>

    <text x="320" y="150" fill="#334155" font-family="sans-serif" font-size="11">Subtotal: Rp 53.000</text>
    <text x="320" y="170" fill="#334155" font-family="sans-serif" font-size="11">Pajak (PB1): Rp 5.300</text>
    <text x="320" y="195" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold">Total: Rp 58.300</text>

    <rect x="320" y="220" width="185" height="32" fill="#10b981" rx="4"/>
    <text x="365" y="240" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Simpan &amp; Cetak</text>
  </g>
</svg>
